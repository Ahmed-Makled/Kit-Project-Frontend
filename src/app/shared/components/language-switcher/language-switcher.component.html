<div class="relative" [class.flex]="compact()" [class.justify-center]="compact()">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'MAIN_LAYOUT.LANGUAGE' | translate"
    class="flex w-full items-center gap-2.5 rounded-[10px] px-2.5 py-2.5 text-xs font-semibold text-app-body transition-colors hover:bg-app-surface hover:text-app-ink"
    [class.justify-center]="compact()"
    [class.px-0]="compact()">
    <svg class="h-[18px] w-[18px] shrink-0 text-primary-600" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path stroke-linecap="round" d="M3 12h18" />
      <path stroke-linecap="round" d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9Z" />
    </svg>
    @if (!compact()) {
      <span class="flex min-w-0 flex-1 items-center justify-between gap-2">
        <span class="truncate">
          {{ (currentLang() === 'ar' ? 'MAIN_LAYOUT.LANGUAGE_AR' : 'MAIN_LAYOUT.LANGUAGE_EN') | translate }}
        </span>
        <svg
          class="h-3.5 w-3.5 shrink-0 text-app-muted transition-transform"
          [class.rotate-180]="isOpen()"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
        </svg>
      </span>
    }
  </button>

  @if (isOpen()) {
    <div
      class="absolute z-50 min-w-[10rem] overflow-hidden rounded-xl border border-app-border bg-white p-1 shadow-dropdown"
      [class]="compact() ? 'top-0 inset-inline-start-full ms-2' : 'bottom-full mb-2 inset-inline-start-0'"
      role="menu"
      [attr.aria-label]="'MAIN_LAYOUT.LANGUAGE' | translate">
      @for (lang of langs; track lang) {
        <button
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="currentLang() === lang"
          (click)="select(lang)"
          class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm font-medium text-app-body transition-colors hover:bg-app-surface hover:text-app-ink">
          <span>{{ (lang === 'ar' ? 'MAIN_LAYOUT.LANGUAGE_AR' : 'MAIN_LAYOUT.LANGUAGE_EN') | translate }}</span>
          @if (currentLang() === lang) {
            <svg class="h-4 w-4 shrink-0 text-primary-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
